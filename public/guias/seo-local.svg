<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" rx="24" fill="#f8f5ef"/><text x="40" y="52" font-family="Arial, sans-serif" font-size="17" fill="#ad360b" font-weight="700">TRAKA / GUÍAS</text><text x="40" y="109" font-family="Arial, sans-serif" font-size="34" fill="#241e19" font-weight="700">Qué conecta tu negocio con una búsqueda</text><text x="40" y="149" font-family="Arial, sans-serif" font-size="22" fill="#241e19" font-weight="400">Tres factores del posicionamiento local</text><rect x="40" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="40" y="205" width="282" height="8" rx="4" fill="#ff5b21"/><text x="60" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Relevancia</text><text x="60" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Qué hacés</text><text x="60" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">Categoría, servicios y contenido</text><text x="60" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">que responden a la búsqueda.</text><rect x="338" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="338" y="205" width="282" height="8" rx="4" fill="#f4bd41"/><text x="358" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Distancia</text><text x="358" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Dónde estás</text><text x="358" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">La ubicación respecto de quien</text><text x="358" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">busca también influye.</text><rect x="636" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="636" y="205" width="282" height="8" rx="4" fill="#245b62"/><text x="656" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Prominencia</text><text x="656" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Qué se sabe de vos</text><text x="656" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">Reseñas, menciones y presencia</text><text x="656" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">coherente en la web.</text><path d="M40 540H920" stroke="#ded6cc"/><text x="40" y="579" font-family="Arial, sans-serif" font-size="20" fill="#241e19" font-weight="400">No existe una posición garantizada para todas las búsquedas.</text></svg>