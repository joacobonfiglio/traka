<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" rx="24" fill="#f8f5ef"/><text x="40" y="52" font-family="Arial, sans-serif" font-size="17" fill="#ad360b" font-weight="700">TRAKA / GUÍAS</text><text x="40" y="109" font-family="Arial, sans-serif" font-size="34" fill="#241e19" font-weight="700">De un proceso a una herramienta</text><text x="40" y="149" font-family="Arial, sans-serif" font-size="22" fill="#241e19" font-weight="400">El alcance se define por el trabajo que hay que resolver</text><rect x="40" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="40" y="205" width="282" height="8" rx="4" fill="#ff5b21"/><text x="60" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Operación</text><text x="60" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Personas y tareas</text><text x="60" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">Quién carga, quién revisa</text><text x="60" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">y quién decide.</text><rect x="338" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="338" y="205" width="282" height="8" rx="4" fill="#f4bd41"/><text x="358" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Información</text><text x="358" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Datos conectados</text><text x="358" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">Pedidos, clientes y pagos</text><text x="358" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">sin repetir la carga.</text><rect x="636" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="636" y="205" width="282" height="8" rx="4" fill="#245b62"/><text x="656" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Entrega</text><text x="656" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Por etapas</text><text x="656" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">Empezar por un módulo útil</text><text x="656" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">y validar antes de ampliar.</text><path d="M40 540H920" stroke="#ded6cc"/><text x="40" y="579" font-family="Arial, sans-serif" font-size="20" fill="#241e19" font-weight="400">Primero revisar si una herramienta existente resuelve el problema.</text></svg>