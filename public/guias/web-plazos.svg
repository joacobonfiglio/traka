<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" rx="24" fill="#f8f5ef"/><text x="40" y="52" font-family="Arial, sans-serif" font-size="17" fill="#ad360b" font-weight="700">TRAKA / GUÍAS</text><text x="40" y="109" font-family="Arial, sans-serif" font-size="34" fill="#241e19" font-weight="700">Qué hace avanzar una página web</text><text x="40" y="149" font-family="Arial, sans-serif" font-size="22" fill="#241e19" font-weight="400">El diseño es una parte del trabajo</text><rect x="40" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="40" y="205" width="282" height="8" rx="4" fill="#ff5b21"/><text x="60" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Definir</text><text x="60" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Alcance y material</text><text x="60" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">Acordar páginas, textos,</text><text x="60" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">imágenes y funciones.</text><rect x="338" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="338" y="205" width="282" height="8" rx="4" fill="#f4bd41"/><text x="358" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Construir</text><text x="358" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Diseño y desarrollo</text><text x="358" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">Armar la web y revisar</text><text x="358" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">el contenido con el cliente.</text><rect x="636" y="205" width="282" height="290" rx="18" fill="white" stroke="#ded6cc"/><rect x="636" y="205" width="282" height="8" rx="4" fill="#245b62"/><text x="656" y="258" font-family="Arial, sans-serif" font-size="19" fill="#ad360b" font-weight="700">Publicar</text><text x="656" y="315" font-family="Arial, sans-serif" font-size="25" fill="#241e19" font-weight="700">Pruebas y entrega</text><text x="656" y="366" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">Revisar celular, enlaces,</text><text x="656" y="396" font-family="Arial, sans-serif" font-size="17" fill="#241e19" font-weight="400">formularios y medición.</text><path d="M40 540H920" stroke="#ded6cc"/><text x="40" y="579" font-family="Arial, sans-serif" font-size="20" fill="#241e19" font-weight="400">Un responsable de aprobar y el material listo evitan demoras.</text></svg>